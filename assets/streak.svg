<svg
  xmlns="http://www.w3.org/2000/svg"
  width="495"
  height="195"
  viewBox="0 0 495 195"
  role="img"
  aria-label="Contribution Streak"
>
  <style>
    .num {
      font: 800 28px 'Segoe UI', Ubuntu, sans-serif;
      fill: #e879a9;
      text-anchor: middle;
    }
    .sub {
      font: 600 12px 'Segoe UI', Ubuntu, sans-serif;
      fill: #8b949e;
      text-anchor: middle;
    }
    .date {
      font: 500 10.5px 'Segoe UI', Ubuntu, sans-serif;
      fill: #6e7681;
      text-anchor: middle;
    }
    .ring-bg {
      fill: none;
      stroke: #30363d;
      stroke-width: 5;
    }
    .ring-prog {
      fill: none;
      stroke: #e879a9;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 45;
      transform: rotate(-90deg);
      transform-origin: 0px 0px;
    }
  </style>

  <rect width="100%" height="100%" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(85, 80)">
    <text x="0" y="0" class="num">6</text>
    <text x="0" y="24" class="sub">Total Contributions</text>
    <text x="0" y="44" class="date">Nov 2025 - Present</text>
  </g>

  <line x1="168" y1="45" x2="168" y2="150" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(247, 98)">
    <circle class="ring-bg" cx="0" cy="0" r="35"/>
    <circle class="ring-prog" cx="0" cy="0" r="35"/>
    <path fill="#e879a9" transform="translate(-7, -26) scale(0.9)" d="M8 0c-.076 0-.15.005-.224.014a4.436 4.436 0 00-3.14 1.34A5.27 5.27 0 003.3 4.298c-.14.288-.24.59-.3.902-.128.66-.075 1.344.154 1.97.23.626.64 1.173 1.18 1.57.19-.38.45-.72.77-.99.32-.27.7-.46 1.11-.56.41-.1.84-.1 1.25 0 .41.1.79.29 1.11.56.32.27.58.61.77.99.54-.397.95-.944 1.18-1.57.23-.626.28-1.31.15-1.97a4.93 4.93 0 00-.3-.902 5.27 5.27 0 00-1.336-2.944 4.436 4.436 0 00-3.14-1.34A4.8 4.8 0 008 0z"/>
    <text x="0" y="6" class="num" font-size="24">1</text>
    <text x="0" y="52" class="sub" font-weight="700">Current Streak</text>
    <text x="0" y="69" class="date">2 Nov</text>
  </g>

  <line x1="326" y1="45" x2="326" y2="150" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(410, 80)">
    <text x="0" y="0" class="num">2</text>
    <text x="0" y="24" class="sub">Longest Streak</text>
    <text x="0" y="44" class="date">1 Nov - 2 Nov</text>
  </g>
</svg>
